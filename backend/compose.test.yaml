services:
  db-test:
    image: postgres:17
    environment:
      POSTGRES_USER: fullfit
      POSTGRES_PASSWORD: fullfit
      POSTGRES_DB: fullfit_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fullfit -d fullfit_test"]
      interval: 3s
      timeout: 3s
      retries: 10